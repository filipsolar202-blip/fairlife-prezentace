<div class="top"><div class="topin"><div class="brand"><i class="ti ti-bolt blue"></i>Filip Solar CRM</div><div class="tabs">
<button class="tab active" onclick="show('auta')" id="tab-auta"><i class="ti ti-shield-check"></i>Auta + majetek <span class="pill" id="p-auta"></span></button>
<button class="tab" onclick="show('zivot')" id="tab-zivot"><i class="ti ti-heart"></i>Životní <span class="pill" id="p-zivot"></span></button>
<button class="tab" onclick="show('uvery')" id="tab-uvery"><i class="ti ti-building-bank"></i>Úvěry + hypotéky <span class="pill" id="p-uvery"></span></button>
<button class="tab" onclick="show('adamek')" id="tab-adamek"><i class="ti ti-user-plus"></i>Potenciál Adámek</button>
<button class="tab" onclick="show('linhart')" id="tab-linhart"><i class="ti ti-user-plus"></i>Potenciál Linhart</button>
<button class="tab" onclick="show('emails')" id="tab-emails"><i class="ti ti-mail"></i>Šablony</button>
<button class="tab" onclick="show('todo')" id="tab-todo"><i class="ti ti-checkbox"></i>TO-DO <span class="pill" id="p-todo"></span></button>
</div></div></div>
<div class="app">
<section id="view-auta" class="view active"></section>
<section id="view-zivot" class="view"></section>
<section id="view-uvery" class="view"></section>
<section id="view-adamek" class="view"></section>
<section id="view-linhart" class="view"></section>
<section id="view-emails" class="view"></section>
<section id="view-todo" class="view"></section>
</div>
<div class="overlay" id="modal-client"><div class="modal"><h3 id="client-title">Klient</h3><div class="grid"><div class="field"><label>Jméno klienta</label><input id="c-name"></div><div class="field"><label>Telefon</label><input id="c-phone"></div><div class="field"><label>Email</label><input id="c-email"></div><div class="field"><label>Adresa</label><input id="c-address"></div><div class="field full"><label>Poznámka ke klientovi</label><textarea id="c-note" style="min-height:80px"></textarea></div></div><div class="row"><button class="btn" onclick="closeModal('modal-client')">Zavřít</button><button class="btn primary" onclick="saveClient()">Uložit klienta</button></div></div></div>
<div class="overlay" id="modal-contract"><div class="modal"><h3 id="contract-title">Smlouva</h3><div class="grid"><div class="field"><label>Typ / sekce</label><select id="s-type"><option>auto</option><option>majetek</option><option>život</option><option>hypotéka</option><option>úvěr</option><option>investice</option><option>DPS</option><option>ostatní</option></select></div><div class="field"><label>Produkt</label><input id="s-product"></div><div class="field"><label>Pojišťovna / banka / producent</label><input id="s-company"></div><div class="field"><label>Číslo smlouvy</label><input id="s-number"></div><div class="field"><label>Výročí / fixace / další kontakt</label><input type="date" id="s-anniv"></div><div class="field"><label>Částka / platba / výše</label><input id="s-amount"></div><div class="field"><label>Úrok</label><input id="s-rate"></div><div class="field"><label>Stav</label><select id="s-status"><option value="">Bez stavu</option><option value="kontakt">Ke kontaktu</option><option value="reseni">V řešení</option><option value="prepojistit">K přepojištění</option><option value="vypoved">Odeslaná výpověď</option><option value="vyrizeno">Vyřízeno</option><option value="nechce">Nechce</option><option value="domluveno">Domluvená schůzka</option><option value="nedovolano">Nedovoláno</option><option value="sms">SMS</option><option value="email">Email</option></select></div><div class="field full"><label>Poznámka ke smlouvě</label><textarea id="s-note" style="min-height:85px"></textarea></div></div><div class="row"><button class="btn red" id="delete-contract" onclick="deleteContract()"><i class="ti ti-trash"></i>Smazat</button><button class="btn" onclick="closeModal('modal-contract')">Zavřít</button><button class="btn primary" onclick="saveContract()">Uložit smlouvu</button></div></div></div>
<div class="overlay" id="modal-email"><div class="modal"><h3>Návrh emailu</h3><div class="grid"><div class="field"><label>Klient</label><select id="email-client" onchange="fillEmailContracts()"></select></div><div class="field"><label>Smlouva</label><select id="email-contract" onchange="previewEmail()"></select></div><div class="field"><label>Šablona</label><select id="email-template" onchange="previewEmail()"></select></div><div class="field"><label>Komu</label><input id="email-to"></div><div class="field full"><label>Předmět</label><input id="email-subject"></div><div class="field full"><label>Text emailu</label><textarea id="email-body"></textarea></div></div><div class="row"><button class="btn" onclick="closeModal('modal-email')">Zavřít</button><button class="btn primary" onclick="openMailto()"><i class="ti ti-send"></i>Otevřít v emailu</button></div></div></div>
<div class="overlay" id="modal-import"><div class="modal"><h3>Import JSON</h3><div class="hint">Vlož export z této aplikace. Import sloučí klienty podle jména a smlouvy podle čísla.</div><textarea id="import-json" style="width:100%;font-family:monospace"></textarea><div class="row"><button class="btn" onclick="closeModal('modal-import')">Zavřít</button><button class="btn primary" onclick="importAll()">Importovat</button></div></div></div>

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function today(){return new Date().toLocaleDateString('cs-CZ')}
function fd(d){if(!d)return'—';let p=String(d).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d}
function parseDate(s){if(!s||String(s).length<8)return null;let d=new Date(s);return isNaN(d)?null:d}
function nextDate(s){let d=parseDate(s?.anniv);if(!d)return null;let t=new Date();t.setHours(0,0,0,0);if(s.type==='auto'||s.type==='majetek'){d.setFullYear(t.getFullYear());if(d<t)d.setFullYear(t.getFullYear()+1)}return d}
function cDays(s){let d=nextDate(s);if(!d)return 99999;let t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)}
function addClientObj(name){let key=norm(name);let found=clients.find(c=>norm(c.name)===key);if(found)return found;let c={id:uid(),name:name||'Bez jména',phone:'',email:'',address:'',note:'',contracts:[]};clients.push(c);return c}
function addContractToClient(name,contract,contact){let c=addClientObj(name);if(contact){c.phone=c.phone||contact.phone||'';c.email=c.email||contact.email||'';c.address=c.address||contact.address||''}let duplicate=c.contracts.find(x=>(x.number&&contract.number&&x.number===contract.number)&&norm(x.type)===norm(contract.type));if(!duplicate)c.contracts.push({...contract,id:contract.id||uid()})}
function mapType(p){let n=norm(p);if(n.includes('auto'))return'auto';if(n.includes('nemovit'))return'majetek';if(n.includes('hyp'))return'hypotéka';if(n.includes('uver')||n.includes('úvěr'))return'úvěr';if(n.includes('zivot')||n.includes('život'))return'život';if(n.includes('dps'))return'DPS';if(n.includes('edward')||n.includes('fki')||n.includes('atris')||n.includes('csnf'))return'investice';return p||'ostatní'}
function mapStatus(s){let n=norm(s);if(n==='ano')return'';if(n.includes('nedovol'))return'nedovolano';if(n.includes('sms'))return'sms';if(n.includes('email'))return'email';if(n.includes('schuz'))return'domluveno';if(n.includes('nech'))return'nechce';return''}
function buildFromDefaults(){clients=[];DEFAULT_ZIV.forEach(x=>addContractToClient(x.klient,{source:'životní',type:'život',product:x.produkt||'Životní pojištění',company:x.producent,number:x.cislo,anniv:x.pocatek,amount:x.platba,status:x.stav==='Aktivní'?'':x.stav,note:x.poznamka||''}));DEFAULT_UVER.forEach(x=>addContractToClient(x.klient,{source:'úvěry',type:norm(x.typ).includes('hyp')?'hypotéka':'úvěr',product:x.produkt||x.typ,company:x.producent,number:x.cislo,anniv:x.fixace,amount:x.vyseUveru,rate:x.urok,status:x.stav==='Aktivní'?'':x.stav,note:x.poznamka||''}));DEFAULT_ADA.forEach(x=>addContractToClient(x.klient,{source:'Adámek',type:mapType(x.produkt),product:x.produkt,company:'',number:x.smlouva,anniv:x.datumUzavreni,amount:x.vyseSml,status:mapStatus(x.aktualniStav||x.osloveni),note:x.poznamka||''},{phone:x.kontakt}));DEFAULT_LIN.forEach(x=>addContractToClient(x.klient,{source:'Linhart',type:mapType(x.produkt),product:x.produkt,company:'',number:x.smlouva,anniv:x.datumUzavreni,amount:x.vyseSml,status:mapStatus(x.aktualniStav||x.osloveni),note:x.poznamka||''},{phone:x.kontakt}))}
function save(){localStorage.setItem(STORE_CLIENTS,JSON.stringify(clients));localStorage.setItem(STORE_TPL,JSON.stringify(templates))}
function load(){try{clients=JSON.parse(localStorage.getItem(STORE_CLIENTS)||localStorage.getItem(OLD_STORE_CLIENTS)||'[]')}catch(e){clients=[]}try{templates=JSON.parse(localStorage.getItem(STORE_TPL)||'[]')}catch(e){templates=[]}if(!templates.length)templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));if(!clients.length){buildFromDefaults();save()}renderAll()}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.getElementById('tab-'+id).classList.add('active');renderAll()}
function typeSet(section){return section==='auta'?['auto','majetek']:section==='zivot'?['život','zivot']:section==='uvery'?['hypotéka','hypoteka','úvěr','uver']:[]}
function sectionContracts(section){let rows=[];clients.forEach(c=>c.contracts.forEach(x=>{let ok=false;if(['auta','zivot','uvery'].includes(section))ok=typeSet(section).includes(norm(x.type));else if(section==='adamek')ok=x.source==='Adámek';else if(section==='linhart')ok=x.source==='Linhart';if(ok)rows.push({client:c,contract:x,days:cDays(x)})}));return rows}
function metric(label,val,cls=''){return `<div class="metric"><div class="l">${label}</div><div class="v ${cls}">${val}</div></div>`}
function statusLabel(s){return {prepojistit:'K přepojištění',reseni:'V řešení',vypoved:'Odeslaná výpověď',vyrizeno:'Vyřízeno',nechce:'Nechce',kontakt:'Ke kontaktu',domluveno:'Domluvená schůzka',nedovolano:'Nedovoláno',sms:'SMS',email:'Email'}[s]||'Bez stavu'}
function classByGroup(s,days){if(s==='vypoved')return'purple';if(s==='prepojistit')return'danger';if(s==='reseni')return'warn';if(days<30)return'danger';if(days<=90)return'warn';return'ok'}
function contractCls(x){let d=cDays(x);return d<30?'danger':d<=90?'warn':'ok'}
function relevantMinDays(contracts){let ds=contracts.map(cDays).filter(d=>d<99999);return ds.length?Math.min(...ds):null}
function clientCard(c,contracts){let min=relevantMinDays(contracts);let cls=classByGroup(contracts[0]?.status,min??99999);let types=[...new Set(contracts.map(x=>x.type))].join(', ');let statuses=[...new Set(contracts.map(x=>x.status).filter(Boolean))];return `<div class="client ${cls}" id="client-${c.id}-${contracts[0]?.source||''}"><div class="client-head" onclick="toggleClient('${c.id}-${contracts[0]?.source||''}')"><div class="bubble"><b>${min??'—'}</b><span>dnů</span></div><div><div class="name">${esc(c.name)} ${contracts.length>1?`<span class="badge">${contracts.length} smlouvy</span>`:''}</div><div class="meta">${esc(c.phone||'—')} · ${esc(types)}</div><div class="badges">${statuses.map(s=>`<span class="badge purple">${esc(statusLabel(s))}</span>`).join('')}${min!==null?`<span class="badge ${min<30?'red':min<=90?'orange':'green'}">nejbližší za ${min} dnů</span>`:''}</div></div><div class="actions"><button class="btn" onclick="event.stopPropagation();openClientModal('${c.id}')"><i class="ti ti-user-edit"></i>Klient</button><button class="btn" onclick="event.stopPropagation();openContractModal('${c.id}')"><i class="ti ti-plus"></i>Smlouva</button></div></div><div class="client-body">${contracts.map(x=>contractCard(c,x)).join('')}</div></div>`}
function contractCard(c,x){let d=cDays(x);return `<div class="contract ${contractCls(x)}"><div><div class="title">${esc(x.type)} · ${esc(x.product||'bez produktu')}</div><div class="sub">${esc(x.company||'—')} · č. ${esc(x.number||'—')} · datum ${fd(x.anniv)}${x.amount?' · '+esc(x.amount):''}${x.rate?' · '+esc(x.rate):''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="badges"><span class="badge ${d<30?'red':d<=90?'orange':'green'}">${d<99999?'za '+d+' dnů':'bez data'}</span>${x.status?`<span class="badge purple">${esc(statusLabel(x.status))}</span>`:''}${x.source?`<span class="badge">${esc(x.source)}</span>`:''}</div></div><div class="contract-actions"><button class="btn" onclick="openEmailFor('${c.id}','${x.id}')"><i class="ti ti-mail"></i>Email</button><button class="btn" onclick="openContractModal('${c.id}','${x.id}')"><i class="ti ti-edit"></i>Správa</button></div></div>`}
function toggleClient(id){document.getElementById('client-'+id)?.classList.toggle('open')}
function groupedRows(rows){let m={};rows.forEach(r=>{let k=r.client.id;if(!m[k])m[k]={client:r.client,contracts:[]};m[k].contracts.push(r.contract)});return Object.values(m)}
function filterRows(rows,section){let q=norm(document.getElementById('q-'+section)?.value||'');let st=document.getElementById('st-'+section)?.value||'';let prod=document.getElementById('prod-'+section)?.value||'';if(q)rows=rows.filter(r=>norm(r.client.name+' '+r.client.phone+' '+r.contract.product+' '+r.contract.number+' '+r.contract.company).includes(q));if(st)rows=rows.filter(r=>r.contract.status===st);if(prod)rows=rows.filter(r=>norm(r.contract.type)===norm(prod));return rows}
function renderSection(section,title,icon,color){let raw=sectionContracts(section);let rows=filterRows(raw,section);let totalContracts=raw.length;let clientsCount=groupedRows(raw).length;let under30=raw.filter(r=>r.days<30).length;let under90=raw.filter(r=>r.days<=90).length;let reseni=raw.filter(r=>r.contract.status==='reseni').length;let prepoj=raw.filter(r=>r.contract.status==='prepojistit'||r.contract.status==='vypoved').length;let view=document.getElementById('view-'+section);let typeFilter=['auta','uvery'].includes(section)?`<select id="prod-${section}" onchange="renderSection('${section}','${title}','${icon}','${color}')"><option value="">Všechny typy</option>${section==='auta'?'<option>auto</option><option>majetek</option>':'<option>hypotéka</option><option>úvěr</option>'}</select>`:'';view.innerHTML=`<div class="head"><h2><i class="ti ${icon}" style="color:${color}"></i>${title}</h2><div class="actions"><button class="btn" onclick="openContractModal(null,null,'${section}')"><i class="ti ti-plus"></i>Přidat</button><button class="btn" onclick="exportAll()"><i class="ti ti-download"></i>Export</button><button class="btn" onclick="openImport()"><i class="ti ti-upload"></i>Import</button><a class="btn" target="_blank" href="https://drive.google.com/drive/folders/130YjntsN3-13QchctOZBqcFXvrDJbh_e"><i class="ti ti-brand-google-drive"></i>Drive</a></div></div><div class="metrics">${metric('Klientů',clientsCount)}${metric('Smluv',totalContracts)}${metric('Do 30 dnů',under30,'red')}${metric('Do 90 dnů',under90,'orange')}${metric('V řešení / výpověď',reseni+prepoj,'purple')}</div><div class="filters"><input id="q-${section}" oninput="renderSection('${section}','${title}','${icon}','${color}')" placeholder="Hledat klienta…">${typeFilter}<select id="st-${section}" onchange="renderSection('${section}','${title}','${icon}','${color}')"><option value="">Všechny stavy</option><option value="kontakt">Ke kontaktu</option><option value="reseni">V řešení</option><option value="prepojistit">K přepojištění</option><option value="vypoved">Odeslaná výpověď</option><option value="vyrizeno">Vyřízeno</option><option value="domluveno">Domluvená schůzka</option><option value="nechce">Nechce</option></select></div><div id="list-${section}"></div>`;let list=document.getElementById('list-'+section);let groups=groupedRows(rows);groups.sort((a,b)=>(relevantMinDays(a.contracts)??99999)-(relevantMinDays(b.contracts)??99999));list.innerHTML=groups.length?`<div class="section-title"><span>Klienti v této sekci</span><span>${groups.length}/${clientsCount}</span></div>`+groups.map(g=>clientCard(g.client,g.contracts)).join(''):`<div class="empty"><i class="ti ti-circle-check"></i>Žádné záznamy</div>`}
function renderTemplates(){let view=document.getElementById('view-emails');view.innerHTML=`<div class="head"><h2><i class="ti ti-mail blue"></i>Šablony emailů</h2><div class="actions"><button class="btn" onclick="newTemplate()"><i class="ti ti-plus"></i>Nová</button></div></div><div class="hint">Proměnné: <b>{klient}</b>, <b>{produkt}</b>, <b>{pojistovna}</b>, <b>{cislo}</b>, <b>{vyroci}</b>, <b>{castka}</b>, <b>{poznamka}</b>, <b>{dnes}</b>. Šablony se uloží do prohlížeče.</div><div class="template-wrap"><div class="tpl-list" id="tpl-list"></div><div><div class="grid"><div class="field"><label>Název</label><input id="tpl-name"></div><div class="field"><label>Předmět</label><input id="tpl-subject"></div><div class="field full"><label>Text emailu</label><textarea id="tpl-body"></textarea></div></div><div class="row"><button class="btn red" onclick="deleteTemplate()">Smazat</button><button class="btn primary" onclick="saveTemplate()">Uložit</button></div></div></div>`;if(!currentTplId&&templates[0])currentTplId=templates[0].id;document.getElementById('tpl-list').innerHTML=templates.map(t=>`<div class="tpl-item ${t.id===currentTplId?'active':''}" onclick="selectTemplate('${t.id}')">${esc(t.name)}</div>`).join('');selectTemplate(currentTplId,false)}
function selectTemplate(id,rer=true){currentTplId=id;let t=templates.find(x=>x.id===id)||templates[0];if(!t)return;document.getElementById('tpl-name').value=t.name;document.getElementById('tpl-subject').value=t.subject;document.getElementById('tpl-body').value=t.body;if(rer)renderTemplates()}
function saveTemplate(){let t=templates.find(x=>x.id===currentTplId);if(!t){t={id:uid()};templates.push(t);currentTplId=t.id}t.name=document.getElementById('tpl-name').value;t.subject=document.getElementById('tpl-subject').value;t.body=document.getElementById('tpl-body').value;save();renderTemplates();alert('Šablona uložena.')}
function newTemplate(){currentTplId=uid();templates.push({id:currentTplId,name:'Nová šablona',subject:'',body:''});save();renderTemplates()}
function deleteTemplate(){if(templates.length<=1)return alert('Nech alespoň jednu šablonu.');if(!confirm('Smazat šablonu?'))return;templates=templates.filter(t=>t.id!==currentTplId);currentTplId=templates[0]?.id;save();renderTemplates()}
function renderTodo(){let rows=[];['auta','zivot','uvery','adamek','linhart'].forEach(sec=>sectionContracts(sec).forEach(r=>{if(r.days<=90&&r.contract.status!=='vyrizeno'&&r.contract.status!=='nechce')rows.push({...r,section:sec})}));rows.sort((a,b)=>a.days-b.days);document.getElementById('view-todo').innerHTML=`<div class="head"><h2><i class="ti ti-checkbox green"></i>TO-DO</h2><div class="actions"><button class="btn" onclick="renderTodo()"><i class="ti ti-refresh"></i>Obnovit</button></div></div><div class="metrics">${metric('Úkolů',rows.length,rows.length?'orange':'green')}${metric('Urgentní do 30 dnů',rows.filter(r=>r.days<30).length,'red')}${metric('Do 90 dnů',rows.filter(r=>r.days<=90).length,'orange')}</div>`+(rows.length?`<div class="section-title"><span>Automatické úkoly</span><span>${rows.length}</span></div>`+rows.map(r=>`<div class="contract ${r.days<30?'danger':'warn'}"><div><div class="title">${esc(r.client.name)} — ${esc(r.contract.product||r.contract.type)}</div><div class="sub">${r.days<30?'Urgentně zkontrolovat':'Připravit kontakt'} · datum ${fd(r.contract.anniv)} · za ${r.days} dnů · ${r.section}</div></div><div class="contract-actions"><button class="btn" onclick="openEmailFor('${r.client.id}','${r.contract.id}')">Email</button><button class="btn" onclick="openContractModal('${r.client.id}','${r.contract.id}')">Otevřít</button></div></div>`).join(''):`<div class="empty"><i class="ti ti-check"></i>Žádné aktuální úkoly</div>`)
}
function updatePills(){let a=sectionContracts('auta').filter(r=>r.days<30).length;let z=sectionContracts('zivot').filter(r=>r.days<=90).length;let u=sectionContracts('uvery').filter(r=>r.days<=100).length;let todo=['auta','zivot','uvery','adamek','linhart'].flatMap(sectionContracts).filter(r=>r.days<=90&&r.contract.status!=='vyrizeno'&&r.contract.status!=='nechce').length;[['p-auta',a],['p-zivot',z],['p-uvery',u],['p-todo',todo]].forEach(([id,n])=>{let e=document.getElementById(id);e.textContent=n||'';e.style.display=n?'inline-flex':'none'})}
function renderAll(){renderSection('auta','Auta + majetek','ti-shield-check','#0b5cad');renderSection('zivot','Životní pojištění','ti-heart','#a62b2b');renderSection('uvery','Úvěry + hypotéky','ti-building-bank','#8a4d08');renderSection('adamek','Potenciál - Adámek','ti-user-plus','#4a3ca0');renderSection('linhart','Potenciál - Linhart','ti-user-plus','#4a3ca0');renderTemplates();renderTodo();updatePills()}
function openClientModal(id){currentClientId=id||null;let c=id?clients.find(x=>x.id===id):{name:'',phone:'',email:'',address:'',note:''};document.getElementById('client-title').textContent=id?'Upravit klienta':'Přidat klienta';['name','phone','email','address','note'].forEach(k=>document.getElementById('c-'+k).value=c[k]||'');openModal('modal-client')}
function saveClient(){let name=document.getElementById('c-name').value.trim();if(!name)return alert('Vyplň jméno klienta.');let c=currentClientId?clients.find(x=>x.id===currentClientId):null;let existing=clients.find(x=>norm(x.name)===norm(name)&&x.id!==currentClientId);if(existing&&!c)c=existing;if(!c){c={id:uid(),contracts:[]};clients.push(c)}['name','phone','email','address','note'].forEach(k=>c[k]=document.getElementById('c-'+k).value);save();closeModal('modal-client');renderAll()}
function openContractModal(clientId,contractId,section){currentClientId=clientId;currentContractId=contractId||null;let c=clientId?clients.find(x=>x.id===clientId):null;if(!c){let name=prompt('Jméno klienta:');if(!name)return;c=addClientObj(name);currentClientId=c.id}let s=contractId?c.contracts.find(x=>x.id===contractId):{type:section==='zivot'?'život':section==='uvery'?'hypotéka':section==='auta'?'auto':'ostatní',product:'',company:'',number:'',anniv:'',amount:'',rate:'',status:'',note:'',source:section==='adamek'?'Adámek':section==='linhart'?'Linhart':''};document.getElementById('contract-title').textContent=(contractId?'Upravit smlouvu — ':'Přidat smlouvu — ')+c.name;document.getElementById('delete-contract').style.display=contractId?'inline-flex':'none';['type','product','company','number','anniv','amount','rate','status','note'].forEach(k=>document.getElementById('s-'+k).value=s[k]||'');openModal('modal-contract')}
function saveContract(){let c=clients.find(x=>x.id===currentClientId);let s=currentContractId?c.contracts.find(x=>x.id===currentContractId):null;if(!s){s={id:uid()};c.contracts.push(s)}['type','product','company','number','anniv','amount','rate','status','note'].forEach(k=>s[k]=document.getElementById('s-'+k).value);s.source=s.source||'';save();closeModal('modal-contract');renderAll()}
function deleteContract(){let c=clients.find(x=>x.id===currentClientId);if(!confirm('Smazat smlouvu?'))return;c.contracts=c.contracts.filter(x=>x.id!==currentContractId);save();closeModal('modal-contract');renderAll()}
function openEmailFor(clientId,contractId){let cs=document.getElementById('email-client');cs.innerHTML=clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');cs.value=clientId||clients[0]?.id;let ts=document.getElementById('email-template');ts.innerHTML=templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');fillEmailContracts(contractId);openModal('modal-email')}
function fillEmailContracts(contractId){let c=clients.find(x=>x.id===document.getElementById('email-client').value);let sel=document.getElementById('email-contract');sel.innerHTML=(c?.contracts||[]).map(x=>`<option value="${x.id}">${esc(x.type+' · '+(x.product||'')+' · '+(x.number||''))}</option>`).join('');if(contractId)sel.value=contractId;previewEmail()}
function values(c,s){return {klient:c?.name||'',produkt:s?.product||s?.type||'',pojistovna:s?.company||'',cislo:s?.number||'',vyroci:fd(s?.anniv),castka:s?.amount||'',poznamka:s?.note||'',dnes:today()}}
function applyTpl(txt,v){return String(txt||'').replace(/\{(klient|produkt|pojistovna|cislo|vyroci|castka|poznamka|dnes)\}/g,(m,k)=>v[k]||'')}
function previewEmail(){let c=clients.find(x=>x.id===document.getElementById('email-client').value);let s=c?.contracts.find(x=>x.id===document.getElementById('email-contract').value)||{};let t=templates.find(x=>x.id===document.getElementById('email-template').value)||templates[0];let v=values(c,s);document.getElementById('email-to').value=c?.email||'';document.getElementById('email-subject').value=applyTpl(t?.subject,v);document.getElementById('email-body').value=applyTpl(t?.body,v)}
function openMailto(){let to=document.getElementById('email-to').value;let sub=encodeURIComponent(document.getElementById('email-subject').value);let body=encodeURIComponent(document.getElementById('email-body').value);location.href=`mailto:${to}?subject=${sub}&body=${body}`}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));
function exportAll(){let blob=new Blob([JSON.stringify({version:9,clients,templates},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='filip-crm-export-v9.json';a.click()}
function openImport(){document.getElementById('import-json').value='';openModal('modal-import')}
function importAll(){try{let data=JSON.parse(document.getElementById('import-json').value);let incoming=data.clients||data||[];incoming.forEach(ic=>{let c=addClientObj(ic.name);['phone','email','address','note'].forEach(k=>c[k]=c[k]||ic[k]||'');(ic.contracts||[]).forEach(s=>{if(!c.contracts.some(x=>x.number&&s.number&&x.number===s.number))c.contracts.push({...s,id:s.id||uid()})})});if(data.templates)templates=data.templates;save();closeModal('modal-import');renderAll();alert('Import hotový.')}catch(e){alert('Chyba v JSON importu.')}}
load();
</script>
</body>
</html>
