<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Filip Solar CRM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
:root{--bg:#ffffff;--bg2:#f6f6f5;--bg3:#eeeeec;--text:#1d1d1f;--muted:#676767;--muted2:#999;--line:rgba(0,0,0,.12);--line2:rgba(0,0,0,.22);--blue:#0b5cad;--green:#2f6b13;--orange:#8a4d08;--red:#a62b2b;--purple:#4a3ca0;--r:11px;--r2:16px;--shadow:0 8px 28px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1d1d1b;--bg2:#282826;--bg3:#333330;--text:#f2f0eb;--muted:#aaa;--muted2:#777;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.24);--shadow:0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}.app{max-width:1120px;margin:0 auto;padding:0 18px 40px}.top{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);z-index:20;border-bottom:1px solid var(--line);padding:10px 0 0}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:700;display:flex;gap:8px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}.tabs{display:flex;gap:22px;overflow:auto;margin-top:18px}.tab{border:0;background:transparent;color:var(--muted);font-size:13px;padding:0 0 10px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}.tab.active{color:var(--text);border-bottom-color:var(--text);font-weight:600}.btn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}.btn:hover{background:var(--bg2)}.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn.red:hover{background:#f9e4e4;color:var(--red);border-color:#d77}.view{display:none;padding-top:24px}.view.active{display:block}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}.metric{background:var(--bg2);border-radius:var(--r);padding:14px;text-align:center}.metric .l{font-size:11px;color:var(--muted);margin-bottom:6px}.metric .v{font-size:22px;font-weight:750}.blue{color:var(--blue)}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.purple{color:var(--purple)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}input,select,textarea{border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--text);padding:9px 10px;font:inherit}input:focus,select:focus,textarea:focus{outline:none;border-color:#398ee8;box-shadow:0 0 0 3px rgba(57,142,232,.12)}.filters input{flex:1;min-width:220px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:24px 0 9px}.client{border:1px solid var(--line);border-radius:0 var(--r2) var(--r2) 0;margin-bottom:8px;overflow:hidden;background:var(--bg);border-left:4px solid var(--line2)}.client.danger{border-left-color:var(--red)}.client.warn{border-left-color:#e09122}.client.info{border-left-color:var(--blue)}.client.ok{border-left-color:var(--green)}.client.open{box-shadow:var(--shadow)}.client-head{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:start;padding:13px 14px;cursor:pointer}.bubble{width:44px;height:44px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}.bubble b{font-size:15px;line-height:1}.bubble span{font-size:9px;text-transform:uppercase;color:var(--muted2)}.name{font-weight:750;font-size:14px;margin-bottom:3px}.meta{font-size:12px;color:var(--muted);line-height:1.45}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.badge{font-size:10px;padding:3px 8px;border-radius:20px;background:var(--bg2);color:var(--muted);display:inline-flex;gap:4px;align-items:center}.badge.red{background:#f9e8e8;color:var(--red)}.badge.orange{background:#fff0db;color:var(--orange)}.badge.blue{background:#e8f2ff;color:var(--blue)}.badge.green{background:#eaf4df;color:var(--green)}.badge.purple{background:#eeeafe;color:var(--purple)}.client-body{display:none;padding:0 14px 14px 74px}.client.open .client-body{display:block}.contract{background:var(--bg2);border-radius:10px;padding:10px 12px;margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.contract .title{font-weight:650;font-size:13px}.contract .sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}.contract-actions{display:flex;gap:5px;align-items:start;flex-wrap:wrap;justify-content:flex-end}.note{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}.empty{text-align:center;color:var(--muted);padding:60px 16px}.empty i{font-size:34px;opacity:.25;display:block;margin-bottom:8px}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:26px 14px;overflow:auto}.overlay.open{display:flex}.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;width:min(680px,100%)}.modal h3{margin:0 0 16px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:var(--muted);font-weight:650}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.template-wrap{display:grid;grid-template-columns:280px 1fr;gap:14px}.tpl-list{border:1px solid var(--line);border-radius:12px;overflow:hidden}.tpl-item{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}.tpl-item:last-child{border-bottom:0}.tpl-item.active{background:var(--bg2);font-weight:700}.hint{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:12px;line-height:1.55;margin-bottom:12px}textarea{min-height:180px;resize:vertical}.small{font-size:11px;color:var(--muted)}.hidden{display:none!important}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.client-head{grid-template-columns:42px 1fr}.client-head>.actions,.right-actions{grid-column:1/-1;justify-content:flex-start}.client-body{padding-left:14px}.contract{grid-template-columns:1fr}.template-wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.toprow{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="toprow"><div class="brand"><i class="ti ti-shield-check blue"></i>Výročí smluv / CRM</div><div class="actions"><button class="btn" onclick="openTemplateQuick()"><i class="ti ti-mail"></i>Šablona</button><button class="btn" onclick="exportAll()"><i class="ti ti-download"></i>Export</button><button class="btn" onclick="openImport()"><i class="ti ti-upload"></i>Import</button><a class="btn" target="_blank" href="https://drive.google.com/drive/folders/130YjntsN3-13QchctOZBqcFXvrDJbh_e"><i class="ti ti-brand-google-drive"></i>Drive</a></div></div>
    <div class="tabs"><button class="tab active" onclick="show('clients')" id="tab-clients"><i class="ti ti-users"></i>Klienti</button><button class="tab" onclick="show('anniv')" id="tab-anniv"><i class="ti ti-bell"></i>Výročí</button><button class="tab" onclick="show('emails')" id="tab-emails"><i class="ti ti-mail"></i>Návrhy emailů</button><button class="tab" onclick="show('todo')" id="tab-todo"><i class="ti ti-checkbox"></i>TO-DO</button><button class="tab" onclick="openClientModal()"><i class="ti ti-plus"></i>Přidat ručně</button></div>
  </div>

  <section id="view-clients" class="view active">
    <div id="metrics-main" class="metrics"></div>
    <div class="filters"><input id="q-clients" oninput="render()" placeholder="Hledat klienta, telefon, smlouvu…"><select id="f-type" onchange="render()"><option value="">Všechny produkty</option><option>auto</option><option>majetek</option><option>život</option><option>hypotéka</option><option>úvěr</option><option>investice</option><option>DPS</option></select><select id="f-status" onchange="render()"><option value="">Všechny stavy</option><option value="prepojistit">K přepojištění</option><option value="reseni">V řešení</option><option value="vypoved">Odeslaná výpověď</option><option value="vyrizeno">Vyřízeno</option></select></div>
    <div id="client-list"></div>
  </section>

  <section id="view-anniv" class="view">
    <div id="metrics-anniv" class="metrics"></div>
    <div class="filters"><input id="q-anniv" oninput="renderAnniv()" placeholder="Hledat ve výročích…"><select id="f-anniv" onchange="renderAnniv()"><option value="90">Do 90 dnů</option><option value="30">Do 30 dnů</option><option value="365">Celý rok</option><option value="all">Vše</option></select></div>
    <div id="anniv-list"></div>
  </section>

  <section id="view-emails" class="view">
    <div class="hint">Šablony můžeš upravovat. Proměnné: <b>{klient}</b>, <b>{produkt}</b>, <b>{pojistovna}</b>, <b>{cislo}</b>, <b>{vyroci}</b>, <b>{castka}</b>, <b>{poznamka}</b>, <b>{dnes}</b>.</div>
    <div class="template-wrap"><div class="tpl-list" id="tpl-list"></div><div><div class="grid"><div class="field"><label>Název šablony</label><input id="tpl-name"></div><div class="field"><label>Předmět</label><input id="tpl-subject"></div><div class="field full"><label>Text emailu</label><textarea id="tpl-body"></textarea></div></div><div class="row"><button class="btn red" onclick="deleteTemplate()"><i class="ti ti-trash"></i>Smazat</button><button class="btn" onclick="newTemplate()"><i class="ti ti-plus"></i>Nová</button><button class="btn primary" onclick="saveTemplate()"><i class="ti ti-device-floppy"></i>Uložit šablonu</button></div></div></div>
  </section>

  <section id="view-todo" class="view"><div id="todo-list"></div></section>
</div>

<div class="overlay" id="modal-client"><div class="modal"><h3 id="client-modal-title">Klient</h3><div class="grid"><div class="field full"><label>Jméno klienta</label><input id="c-name"></div><div class="field"><label>Telefon</label><input id="c-phone"></div><div class="field"><label>Email</label><input id="c-email"></div><div class="field full"><label>Adresa</label><input id="c-address"></div><div class="field full"><label>Poznámka ke klientovi</label><textarea id="c-note" style="min-height:80px"></textarea></div></div><div class="row"><button class="btn" onclick="closeModal('modal-client')">Zavřít</button><button class="btn primary" onclick="saveClient()">Uložit klienta</button></div></div></div>

<div class="overlay" id="modal-contract"><div class="modal"><h3 id="contract-modal-title">Smlouva</h3><div class="grid"><div class="field"><label>Typ</label><select id="s-type"><option>auto</option><option>majetek</option><option>život</option><option>hypotéka</option><option>úvěr</option><option>investice</option><option>DPS</option><option>ostatní</option></select></div><div class="field"><label>Produkt</label><input id="s-product"></div><div class="field"><label>Pojišťovna / banka / producent</label><input id="s-company"></div><div class="field"><label>Číslo smlouvy</label><input id="s-number"></div><div class="field"><label>Výročí / fixace / další kontakt</label><input type="date" id="s-anniv"></div><div class="field"><label>Částka / platba / výše</label><input id="s-amount"></div><div class="field"><label>Úrok</label><input id="s-rate"></div><div class="field"><label>Stav</label><select id="s-status"><option value="">Bez stavu</option><option value="kontakt">Ke kontaktu</option><option value="reseni">V řešení</option><option value="prepojistit">K přepojištění</option><option value="vypoved">Odeslaná výpověď</option><option value="vyrizeno">Vyřízeno</option><option value="nechce">Nechce</option></select></div><div class="field full"><label>Poznámka ke smlouvě</label><textarea id="s-note" style="min-height:80px"></textarea></div></div><div class="row"><button class="btn red" id="delete-contract-btn" onclick="deleteContract()">Smazat</button><button class="btn" onclick="closeModal('modal-contract')">Zavřít</button><button class="btn primary" onclick="saveContract()">Uložit smlouvu</button></div></div></div>

<div class="overlay" id="modal-email"><div class="modal"><h3>Email pro klienta</h3><div class="grid"><div class="field"><label>Klient</label><select id="email-client" onchange="fillEmailContracts()"></select></div><div class="field"><label>Smlouva</label><select id="email-contract" onchange="previewEmail()"></select></div><div class="field full"><label>Šablona</label><select id="email-template" onchange="previewEmail()"></select></div><div class="field full"><label>Komu</label><input id="email-to"></div><div class="field full"><label>Předmět</label><input id="email-subject"></div><div class="field full"><label>Text</label><textarea id="email-body"></textarea></div></div><div class="row"><button class="btn" onclick="closeModal('modal-email')">Zavřít</button><button class="btn primary" onclick="openMailto()"><i class="ti ti-send"></i>Otevřít v emailu</button></div></div></div>

<div class="overlay" id="modal-import"><div class="modal"><h3>Import CRM</h3><div class="hint">Vlož JSON export z této aplikace. Import sloučí klienty podle jména a nebude vytvářet duplicity.</div><textarea id="import-json" style="width:100%;min-height:180px"></textarea><div class="row"><button class="btn" onclick="closeModal('modal-import')">Zavřít</button><button class="btn primary" onclick="importAll()">Importovat</button></div></div></div>

function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fd(d){if(!d)return'—';let p=String(d).split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:d}
function today(){return new Date().toLocaleDateString('cs-CZ')}
function daysToAnnual(ds){if(!ds)return 99999;let t=new Date();t.setHours(0,0,0,0);let d=new Date(ds);if(isNaN(d))return 99999;d.setFullYear(t.getFullYear());if(d<t)d.setFullYear(t.getFullYear()+1);return Math.round((d-t)/86400000)}
function daysAbs(ds){if(!ds)return 99999;let t=new Date();t.setHours(0,0,0,0);let d=new Date(ds);if(isNaN(d))return 99999;return Math.round((d-t)/86400000)}
function nextDate(c){return c.anniv||c.fixace||c.next||''}
function cDays(c){return ['hypotéka','hypoteka','úvěr','uver'].includes(norm(c.type))&&c.anniv?daysAbs(c.anniv):daysToAnnual(nextDate(c))}
function statusClass(client){let min=client.contracts.reduce((m,c)=>Math.min(m,cDays(c)),99999);let hot=client.contracts.some(c=>['prepojistit','vypoved'].includes(c.status));if(hot||min<30)return'danger';if(min<=70)return'warn';if(min<=90)return'info';return'ok'}
function addClientObj(name){let key=norm(name);let found=clients.find(c=>norm(c.name)===key);if(found)return found;let c={id:uid(),name:name||'Bez jména',phone:'',email:'',address:'',note:'',log:[],contracts:[]};clients.push(c);return c}
function addContractToClient(name,contract,contact){let c=addClientObj(name);if(contact){c.phone=c.phone||contact.phone||'';c.email=c.email||contact.email||'';c.address=c.address||contact.address||''}let duplicate=c.contracts.find(x=>(x.number&&contract.number&&x.number===contract.number)&&(norm(x.type)===norm(contract.type)));if(!duplicate)c.contracts.push({...contract,id:contract.id||uid()});}
function buildFromDefaults(){clients=[];
 DEFAULT_ZIV.forEach(x=>addContractToClient(x.klient,{source:'životní',type:'život',product:x.produkt||'Životní pojištění',company:x.producent,number:x.cislo,anniv:x.pocatek,amount:x.platba,status:x.stav==='Aktivní'?'':x.stav,note:x.poznamka||'',raw:x}));
 DEFAULT_UVER.forEach(x=>addContractToClient(x.klient,{source:'úvěry',type:norm(x.typ).includes('hyp')?'hypotéka':'úvěr',product:x.produkt||x.typ,company:x.producent,number:x.cislo,anniv:x.fixace,amount:x.vyseUveru,rate:x.urok,status:x.stav==='Aktivní'?'':x.stav,note:x.poznamka||'',raw:x}));
 DEFAULT_ADA.forEach(x=>addContractToClient(x.klient,{source:'Adámek',type:mapType(x.produkt),product:x.produkt,company:'',number:x.smlouva,anniv:x.datumUzavreni,amount:x.vyseSml,status:mapStatus(x.aktualniStav||x.osloveni),note:x.poznamka||'',raw:x},{phone:x.kontakt}));

}
function mapType(p){let n=norm(p);if(n.includes('auto'))return'auto';if(n.includes('nemovit'))return'majetek';if(n.includes('zivot'))return'život';if(n.includes('hyp'))return'hypotéka';if(n.includes('uver'))return'úvěr';if(n.includes('edward')||n.includes('fki')||n.includes('atris')||n.includes('csnf'))return'investice';if(n.includes('dps'))return'DPS';return p||'ostatní'}
function mapStatus(s){if(!s)return'';let n=norm(s);if(n==='ano')return'kontakt';if(n.includes('schuz'))return'reseni';return s}
function load(){try{clients=JSON.parse(localStorage.getItem(STORE_CLIENTS)||'[]')}catch(e){clients=[]}try{templates=JSON.parse(localStorage.getItem(STORE_TPL)||'[]')}catch(e){templates=[]}if(!templates.length)templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));if(!clients.length){buildFromDefaults();save()}render();renderTemplates();}
function save(){localStorage.setItem(STORE_CLIENTS,JSON.stringify(clients));localStorage.setItem(STORE_TPL,JSON.stringify(templates));}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');let tab=document.getElementById('tab-'+id);if(tab)tab.classList.add('active');if(id==='anniv')renderAnniv();if(id==='todo')renderTodo();if(id==='emails')renderTemplates();}
function metricsHtml(list){let contracts=list.flatMap(c=>c.contracts);let d90=contracts.filter(c=>cDays(c)<=90&&cDays(c)>=0).length;let hot=contracts.filter(c=>c.status==='prepojistit').length;let res=contracts.filter(c=>c.status==='reseni').length;let k70=contracts.filter(c=>{let d=cDays(c);return d>=70&&d<=90}).length;return `<div class="metric"><div class="l">Celkem klientů</div><div class="v">${list.length}</div></div><div class="metric"><div class="l">Celkem smluv</div><div class="v green">${contracts.length}</div></div><div class="metric"><div class="l">Do 90 dnů</div><div class="v orange">${d90}</div></div><div class="metric"><div class="l">🔥 K přepojištění</div><div class="v red">${hot}</div></div><div class="metric"><div class="l">V řešení</div><div class="v purple">${res}</div></div>`}
function getFilteredClients(){let q=norm(document.getElementById('q-clients')?.value||'');let t=norm(document.getElementById('f-type')?.value||'');let st=document.getElementById('f-status')?.value||'';let arr=clients.filter(c=>{let text=norm([c.name,c.phone,c.email,c.note,...c.contracts.map(x=>[x.type,x.product,x.company,x.number,x.note].join(' '))].join(' '));if(q&&!text.includes(q))return false;if(t&&!c.contracts.some(x=>norm(x.type)===t||norm(x.product).includes(t)))return false;if(st&&!c.contracts.some(x=>x.status===st))return false;return true});arr.sort((a,b)=>Math.min(...a.contracts.map(cDays),99999)-Math.min(...b.contracts.map(cDays),99999));return arr}
function render(){let list=getFilteredClients();document.getElementById('metrics-main').innerHTML=metricsHtml(clients);let el=document.getElementById('client-list');if(!list.length){el.innerHTML='<div class="empty"><i class="ti ti-circle-check"></i>Zatím žádní klienti</div>';return}el.innerHTML='<div class="section-title">Klienti bez duplicit</div>'+list.map(clientCard).join('')}
function clientCard(c){let min=Math.min(...c.contracts.map(cDays),99999);let cls=statusClass(c);let counts={};c.contracts.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);let badges=Object.entries(counts).map(([k,v])=>`<span class="badge blue">${esc(k)} ${v}</span>`).join('');let urgent=min<99999?`<span class="badge ${min<30?'red':min<=90?'orange':'green'}">nejbližší za ${min} dnů</span>`:'';return `<div class="client ${cls}" id="client-${c.id}"><div class="client-head" onclick="toggleClient('${c.id}')"><div class="bubble"><b>${min<99999?min:'?'}</b><span>dnů</span></div><div><div class="name">${esc(c.name)}</div><div class="meta">${esc([c.phone,c.email].filter(Boolean).join(' · ')||'bez kontaktu')} · ${c.contracts.length} smluv</div><div class="badges">${urgent}${badges}</div>${c.note?`<div class="note">${esc(c.note)}</div>`:''}</div><div class="actions right-actions" onclick="event.stopPropagation()"><button class="btn" onclick="openEmailFor('${c.id}')"><i class="ti ti-mail"></i>Email</button><button class="btn" onclick="openClientModal('${c.id}')"><i class="ti ti-edit"></i>Klient</button><button class="btn primary" onclick="openContractModal('${c.id}')"><i class="ti ti-plus"></i>Smlouva</button></div></div><div class="client-body">${c.contracts.map(x=>contractRow(c,x)).join('')}</div></div>`}
function contractRow(c,x){let d=cDays(x);let bd=d<30?'red':d<=90?'orange':'green';return `<div class="contract"><div><div class="title">${esc(x.type)} · ${esc(x.product||'bez produktu')}</div><div class="sub">${esc(x.company||'—')} · č. ${esc(x.number||'—')} · datum ${fd(nextDate(x))}${x.amount?' · '+esc(x.amount):''}${x.rate?' · '+esc(x.rate):''}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="badges"><span class="badge ${bd}">${d<99999?'za '+d+' dnů':'bez data'}</span>${x.status?`<span class="badge purple">${esc(x.status)}</span>`:''}${x.source?`<span class="badge">${esc(x.source)}</span>`:''}</div></div><div class="contract-actions"><button class="btn" onclick="openEmailFor('${c.id}','${x.id}')"><i class="ti ti-mail"></i>Email</button><button class="btn" onclick="openContractModal('${c.id}','${x.id}')"><i class="ti ti-edit"></i>Upravit</button></div></div>`}
function toggleClient(id){document.getElementById('client-'+id)?.classList.toggle('open')}
function renderAnniv(){let q=norm(document.getElementById('q-anniv')?.value||'');let f=document.getElementById('f-anniv')?.value||'90';let rows=[];clients.forEach(c=>c.contracts.forEach(x=>rows.push({client:c,contract:x,days:cDays(x)})));rows=rows.filter(r=>r.days>=0&&r.days<99999);if(f!=='all')rows=rows.filter(r=>r.days<=Number(f));if(q)rows=rows.filter(r=>norm(r.client.name+' '+r.contract.product+' '+r.contract.number).includes(q));rows.sort((a,b)=>a.days-b.days);document.getElementById('metrics-anniv').innerHTML=metricsHtml(clients);document.getElementById('anniv-list').innerHTML=rows.length?'<div class="section-title">Nejbližší výročí / fixace</div>'+rows.map(r=>`<div class="client ${r.days<30?'danger':r.days<=90?'warn':'ok'}"><div class="client-head" onclick="openContractModal('${r.client.id}','${r.contract.id}')"><div class="bubble"><b>${r.days}</b><span>dnů</span></div><div><div class="name">${esc(r.client.name)}</div><div class="meta">${esc(r.contract.type)} · ${esc(r.contract.product||'')} · ${esc(r.contract.company||'')} · ${fd(nextDate(r.contract))}</div><div class="badges"><span class="badge ${r.days<30?'red':'orange'}">${r.days<30?'urgentní':'do 90 dnů'}</span></div></div><div class="actions"><button class="btn" onclick="event.stopPropagation();openEmailFor('${r.client.id}','${r.contract.id}')"><i class="ti ti-mail"></i>Email</button></div></div></div>`).join(''):'<div class="empty"><i class="ti ti-check"></i>Žádné blížící se výročí</div>'}
function renderTodo(){let rows=[];clients.forEach(c=>c.contracts.forEach(x=>{let d=cDays(x);if(d>=0&&d<=90&&x.status!=='vyrizeno')rows.push({client:c,contract:x,days:d})}));rows.sort((a,b)=>a.days-b.days);document.getElementById('todo-list').innerHTML=rows.length?'<div class="section-title">Automatické úkoly</div>'+rows.map(r=>`<div class="contract"><div><div class="title">${esc(r.client.name)} — ${esc(r.contract.product||r.contract.type)}</div><div class="sub">${r.days<30?'Urgentně zkontrolovat':'Připravit kontakt'} · datum ${fd(nextDate(r.contract))} · za ${r.days} dnů</div></div><div class="contract-actions"><button class="btn" onclick="openEmailFor('${r.client.id}','${r.contract.id}')">Email</button><button class="btn" onclick="openContractModal('${r.client.id}','${r.contract.id}')">Otevřít</button></div></div>`).join(''):'<div class="empty"><i class="ti ti-check"></i>Žádné aktuální úkoly</div>'}
function openClientModal(id){currentClientId=id||null;let c=id?clients.find(x=>x.id===id):{name:'',phone:'',email:'',address:'',note:''};document.getElementById('client-modal-title').textContent=id?'Upravit klienta':'Přidat klienta';['name','phone','email','address','note'].forEach(k=>document.getElementById('c-'+k).value=c[k]||'');openModal('modal-client')}
function saveClient(){let name=document.getElementById('c-name').value.trim();if(!name)return alert('Vyplň jméno klienta.');let existing=clients.find(c=>norm(c.name)===norm(name)&&c.id!==currentClientId);let c=currentClientId?clients.find(x=>x.id===currentClientId):null;if(existing&&!c){c=existing}else if(!c){c={id:uid(),contracts:[],log:[]};clients.push(c)}c.name=name;c.phone=document.getElementById('c-phone').value;c.email=document.getElementById('c-email').value;c.address=document.getElementById('c-address').value;c.note=document.getElementById('c-note').value;save();closeModal('modal-client');render()}
function openContractModal(clientId,contractId){currentClientId=clientId;currentContractId=contractId||null;let c=clients.find(x=>x.id===clientId);let s=contractId?c.contracts.find(x=>x.id===contractId):{type:'auto',product:'',company:'',number:'',anniv:'',amount:'',rate:'',status:'',note:''};document.getElementById('contract-modal-title').textContent=(contractId?'Upravit smlouvu — ':'Přidat smlouvu — ')+c.name;document.getElementById('delete-contract-btn').style.display=contractId?'inline-flex':'none';['type','product','company','number','anniv','amount','rate','status','note'].forEach(k=>document.getElementById('s-'+k).value=s[k]||'');openModal('modal-contract')}
function saveContract(){let c=clients.find(x=>x.id===currentClientId);let s=currentContractId?c.contracts.find(x=>x.id===currentContractId):null;if(!s){s={id:uid()};c.contracts.push(s)}['type','product','company','number','anniv','amount','rate','status','note'].forEach(k=>s[k]=document.getElementById('s-'+k).value);save();closeModal('modal-contract');render();renderAnniv()}
function deleteContract(){let c=clients.find(x=>x.id===currentClientId);if(!confirm('Smazat smlouvu?'))return;c.contracts=c.contracts.filter(x=>x.id!==currentContractId);save();closeModal('modal-contract');render()}
function renderTemplates(){let list=document.getElementById('tpl-list');if(!currentTplId&&templates[0])currentTplId=templates[0].id;list.innerHTML=templates.map(t=>`<div class="tpl-item ${t.id===currentTplId?'active':''}" onclick="selectTemplate('${t.id}')">${esc(t.name)}</div>`).join('');selectTemplate(currentTplId,false)}
function selectTemplate(id,rer=true){currentTplId=id;let t=templates.find(x=>x.id===id)||templates[0];if(!t)return;document.getElementById('tpl-name').value=t.name;document.getElementById('tpl-subject').value=t.subject;document.getElementById('tpl-body').value=t.body;if(rer)renderTemplates()}
function saveTemplate(){let t=templates.find(x=>x.id===currentTplId);if(!t){t={id:uid()};templates.push(t);currentTplId=t.id}t.name=document.getElementById('tpl-name').value;t.subject=document.getElementById('tpl-subject').value;t.body=document.getElementById('tpl-body').value;save();renderTemplates();alert('Šablona uložena.')}
function newTemplate(){currentTplId=uid();templates.push({id:currentTplId,name:'Nová šablona',subject:'',body:''});save();renderTemplates()}
function deleteTemplate(){if(templates.length<=1)return alert('Nech alespoň jednu šablonu.');if(!confirm('Smazat šablonu?'))return;templates=templates.filter(t=>t.id!==currentTplId);currentTplId=templates[0]?.id;save();renderTemplates()}
function openTemplateQuick(){show('emails')}
function openEmailFor(clientId,contractId){let cs=document.getElementById('email-client');cs.innerHTML=clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');cs.value=clientId||clients[0]?.id;let ts=document.getElementById('email-template');ts.innerHTML=templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');fillEmailContracts(contractId);openModal('modal-email')}
function fillEmailContracts(contractId){let c=clients.find(x=>x.id===document.getElementById('email-client').value);let sel=document.getElementById('email-contract');sel.innerHTML=(c?.contracts||[]).map(x=>`<option value="${x.id}">${esc(x.type+' · '+(x.product||'')+' · '+(x.number||''))}</option>`).join('');if(contractId)sel.value=contractId;previewEmail()}
function values(c,s){return {klient:c?.name||'',produkt:s?.product||s?.type||'',pojistovna:s?.company||'',cislo:s?.number||'',vyroci:fd(nextDate(s||{})),castka:s?.amount||'',poznamka:s?.note||'',dnes:today()}}
function applyTpl(txt,v){return String(txt||'').replace(/\{(klient|produkt|pojistovna|cislo|vyroci|castka|poznamka|dnes)\}/g,(m,k)=>v[k]||'')}
function previewEmail(){let c=clients.find(x=>x.id===document.getElementById('email-client').value);let s=c?.contracts.find(x=>x.id===document.getElementById('email-contract').value)||{};let t=templates.find(x=>x.id===document.getElementById('email-template').value)||templates[0];let v=values(c,s);document.getElementById('email-to').value=c?.email||'';document.getElementById('email-subject').value=applyTpl(t?.subject,v);document.getElementById('email-body').value=applyTpl(t?.body,v)}
function openMailto(){let to=document.getElementById('email-to').value;let sub=encodeURIComponent(document.getElementById('email-subject').value);let body=encodeURIComponent(document.getElementById('email-body').value);location.href=`mailto:${to}?subject=${sub}&body=${body}`}
function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));
function exportAll(){let blob=new Blob([JSON.stringify({version:3,clients,templates},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='filip-crm-export.json';a.click()}
function openImport(){document.getElementById('import-json').value='';openModal('modal-import')}
function importAll(){try{let data=JSON.parse(document.getElementById('import-json').value);let incoming=data.clients||data||[];incoming.forEach(ic=>{let c=addClientObj(ic.name);['phone','email','address','note'].forEach(k=>c[k]=c[k]||ic[k]||'');(ic.contracts||[]).forEach(s=>{if(!c.contracts.some(x=>x.number&&s.number&&x.number===s.number))c.contracts.push({...s,id:s.id||uid()})})});if(data.templates)templates=data.templates;save();closeModal('modal-import');render();alert('Import hotový.')}catch(e){alert('Chyba v JSON importu.')}}
load();
</script>
