.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d7e0ec;border-radius:9px;background:#fff;color:#334155;padding:9px 13px;cursor:pointer;font-weight:650;font-size:13px}.btn:hover{background:#f8fafc}.btn.primary{background:#2563eb;border-color:#2563eb;color:#fff}.btn.green{background:#dcfce7;color:#166534;border-color:#86efac}.btn.red{background:#fee2e2;color:#991b1b;border-color:#fecaca}.btn.small{padding:6px 9px;font-size:12px}
.wrap{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 64px)}.side{background:#fff;border-right:1px solid #dfe7f1;overflow:auto}.main{overflow:auto;padding:24px}
.search{padding:14px;border-bottom:1px solid #edf2f7}.search input{width:100%;border:1px solid #d7e0ec;border-radius:10px;padding:10px 12px;background:#f8fafc;outline:none}.search input:focus{border-color:#2563eb;background:#fff}
.filters{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid #edf2f7}.pill{border:1px solid #d7e0ec;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;color:#64748b;cursor:pointer}.pill.active{background:#2563eb;color:#fff;border-color:#2563eb}
.kpis{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #edf2f7;background:#edf2f7;gap:1px}.kpi{background:#fff;padding:10px;text-align:center}.kpi b{display:block;font-size:13px}.kpi span{font-size:10px;color:#8a99ab;text-transform:uppercase;letter-spacing:.04em}
.client{margin:7px 8px;padding:12px;border:1px solid #edf2f7;border-radius:12px;background:#fff;cursor:pointer}.client:hover{background:#f8fafc;border-color:#cbd5e1}.client.active{background:#eff6ff;border-color:#2563eb}.client.eligible{border-left:4px solid #16a34a}.client-name{font-weight:800;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.client-bottom{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.muted{color:#8a99ab;font-size:12px}.money{font-weight:800;font-variant-numeric:tabular-nums}.pos{color:#15803d}.neg{color:#dc2626}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:10px;font-weight:800;text-transform:uppercase}.tag.green{background:#dcfce7;color:#166534}.tag.orange{background:#fef3c7;color:#92400e}.tag.blue{background:#dbeafe;color:#1d4ed8}.tag.gray{background:#f1f5f9;color:#64748b}.tag.red{background:#fee2e2;color:#991b1b}
.panel{display:none;background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 1px 5px rgba(15,23,42,.05)}.panel.open{display:block}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel h3{margin:0;font-size:16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;color:#64748b;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #d7e0ec;border-radius:9px;padding:9px 10px;outline:none}.field input:focus,.field select:focus{border-color:#2563eb}.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #edf2f7}
.drop{border:2px dashed #cbd5e1;border-radius:14px;padding:28px;text-align:center;background:#f8fafc;cursor:pointer}.drop.drag,.drop:hover{border-color:#2563eb;background:#eff6ff}.help{background:#f8fafc;border:1px solid #edf2f7;border-radius:12px;padding:14px;color:#64748b;line-height:1.7;font-size:13px}
.welcome{height:70vh;display:grid;place-items:center;text-align:center;color:#8a99ab}.welcome h2{color:#475569;margin:0 0 8px}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}.detail-head h1{margin:0;font-size:26px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:18px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:16px;box-shadow:0 1px 4px rgba(15,23,42,.04)}.card span{display:block;color:#8a99ab;font-size:11px;text-transform:uppercase;font-weight:800;margin-bottom:6px}.card b{font-size:20px;font-variant-numeric:tabular-nums}

<header class="header"><div class="brand"><div class="logo">FS</div><div><div class="title">Investment CRM</div><div class="sub">Solár Filip · FairLife</div></div></div><div class="actions"><button class="btn" onclick="togglePanel('importPanel')">⬆ Import CSV</button><button class="btn" onclick="downloadTemplate()">⬇ Vzor CSV</button><button class="btn primary" onclick="openForm()">+ Nový záznam</button></div></header>
<div class="wrap"><aside class="side"><div class="search"><input id="search" placeholder="🔍 Hledat klienta…" oninput="renderAll()"></div><div class="filters"><button class="pill active" data-filter="all" onclick="setFilter('all')">Všichni</button><button class="pill" data-filter="eligible" onclick="setFilter('eligible')">✓ Odkup</button><button class="pill" data-filter="soon" onclick="setFilter('soon')">⏱ Brzy</button></div><div class="kpis" id="sideStats"></div><div id="clientList"></div></aside><main class="main">
<section class="panel" id="importPanel"><div class="panel-head"><h3>Import CSV</h3><button class="btn small" onclick="togglePanel('importPanel')">✕ Zavřít</button></div><div class="grid" style="grid-template-columns:1fr 1fr"><label class="drop" id="drop"><input type="file" id="fileInput" accept=".csv" style="display:none" onchange="handleFile(this.files[0])"><div style="font-size:32px">📄</div><b>Klikni nebo přetáhni CSV</b><div class="muted">oddělovač ; nebo , · UTF-8</div></label><div class="help"><b>Povinné minimum:</b><br>Investor, Fond, Čistá investice, Aktuální hodnota investice, Datum emise<br><br><b>Klíč pro aktualizaci:</b><br>Investor + Fond + Datum emise</div></div></section>
<section class="panel" id="formPanel"><div class="panel-head"><h3 id="formTitle">Nový záznam</h3><button class="btn small" onclick="closeForm()">✕ Zavřít</button></div><div class="grid"><div class="field"><label>Investor *</label><input id="fInvestor"></div><div class="field"><label>Fond *</label><input id="fFond"></div><div class="field"><label>Typ transakce</label><select id="fTyp"><option>Platba</option><option>Konverze</option><option>Převod</option><option>Odkup</option></select></div><div class="field"><label>Čistá investice *</label><input id="fInvest" type="number"></div><div class="field"><label>Aktuální hodnota</label><input id="fCurrent" type="number"></div><div class="field"><label>Datum připsání</label><input id="fPayDate" type="date"></div><div class="field"><label>Datum emise</label><input id="fIssueDate" type="date"></div><div class="field"><label>Hodnota CP</label><input id="fNav" type="number" step="0.0001"></div><div class="field"><label>Hodnota platná do</label><input id="fNavTo" type="date"></div><div class="field"><label>ISIN</label><input id="fIsin"></div><div class="field"><label>Typ CP</label><input id="fSecurityType"></div></div><input type="hidden" id="editIndex"><div class="footer"><button class="btn" onclick="closeForm()">Zrušit</button><button class="btn primary" onclick="saveRecord()">Uložit</button></div></section>
<div id="content" class="welcome"><div><div style="font-size:52px;opacity:.45">💼</div><h2>Vyber klienta</h2><div>Klikni vlevo na klienta a zobrazí se portfolio.</div></div></div>
</main></div><div class="toast" id="toast"></div>

const STORE_KEY = 'investment-crm-v5';
let records = [];
let selectedClient = null;
let activeFilter = 'all';
function num(v){ if (v === null || v === undefined || v === '') return 0; return Number(String(v).replace(/\s/g,'').replace(',','.')) || 0; }
function money(v){ return Number.isFinite(Number(v)) ? new Intl.NumberFormat('cs-CZ',{style:'currency',currency:'CZK',maximumFractionDigits:0}).format(Number(v)) : '—'; }
function percent(v){ return Number.isFinite(Number(v)) ? (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%' : '—'; }
function html(s){ return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function parseDate(v){ if (!v) return null; const s = String(v).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return new Date(s.slice(0,10)+'T12:00:00'); const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/); if(m) return new Date(`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}T12:00:00`); const d=new Date(s); return isNaN(d) ? null : d; }
function dateOut(v){ const d=parseDate(v); return d ? d.toLocaleDateString('cs-CZ') : '—'; }
function isoDate(v){ const d=parseDate(v); return d ? d.toISOString().slice(0,10) : null; }
function addMonths(date, months){ const d = new Date(date); const day = d.getDate(); d.setMonth(d.getMonth()+months); if(d.getDate() !== day) d.setDate(0); return d; }
function redeemDate(issue){ const d=parseDate(issue); return d ? addMonths(d,36) : null; }
function daysToRedeem(issue){ const r=redeemDate(issue); if(!r) return null; return Math.ceil((r - new Date()) / 86400000); }
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(records)); }
function load(){ try { records = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { records = []; } if(!Array.isArray(records) || !records.length) records = SEED.slice(); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function clients(){ const map = new Map(); records.forEach((r,index)=>{ const name=String(r['Investor']||'Neznámý klient').trim(); if(!map.has(name)) map.set(name,{name,rows:[],indexes:[]}); map.get(name).rows.push(r); map.get(name).indexes.push(index); }); return [...map.values()].map(c=>{ const invested=c.rows.reduce((s,r)=>s+Math.max(0,num(r['Čistá investice'])),0); const current=c.rows.reduce((s,r)=>s+num(r['Aktuální hodnota investice']),0); const ds=c.rows.map(r=>daysToRedeem(r['Datum emise'])); const eligible=c.rows.some(r=>daysToRedeem(r['Datum emise'])!==null&&daysToRedeem(r['Datum emise'])<=0&&num(r['Aktuální hodnota investice'])>0&&r['Typ transakce']!=='Odkup'); const soon=!eligible&&ds.some(d=>d!==null&&d>0&&d<=180); return {...c,invested,current,profit:current-invested,profitPct:invested?(current-invested)/invested*100:0,eligible,soon}; }).sort((a,b)=>b.invested-a.invested); }
function renderAll(){ renderStats(); renderList(); if(selectedClient) renderDetail(selectedClient); }
function renderStats(){ const cs=clients(); const inv=cs.reduce((s,c)=>s+c.invested,0); const cur=cs.reduce((s,c)=>s+c.current,0); document.getElementById('sideStats').innerHTML = `<div class="kpi"><span>Klientů</span><b>${cs.length}</b></div><div class="kpi"><span>Odkup</span><b class="pos">${cs.filter(c=>c.eligible).length}</b></div><div class="kpi"><span>Vloženo</span><b>${money(inv)}</b></div><div class="kpi"><span>Hodnota</span><b class="pos">${money(cur)}</b></div>`; }
function setFilter(f){ activeFilter=f; document.querySelectorAll('.pill').forEach(b=>b.classList.toggle('active',b.dataset.filter===f)); renderList(); }
function renderList(){ const q=document.getElementById('search').value.trim().toLowerCase(); let cs=clients().filter(c=>c.name.toLowerCase().includes(q)); if(activeFilter==='eligible') cs=cs.filter(c=>c.eligible); if(activeFilter==='soon') cs=cs.filter(c=>c.soon); const el=document.getElementById('clientList'); if(!cs.length){ el.innerHTML='<div class="empty">Žádní klienti</div>'; return; } el.innerHTML=cs.map(c=>{ const funds=new Set(c.rows.map(r=>r['Fond']).filter(Boolean)).size; return `<div class="client ${c.eligible?'eligible':''} ${c.name===selectedClient?'active':''}" onclick="selectClient(${JSON.stringify(c.name)})"><div class="client-name">${html(c.name)}${c.eligible?'<span class="tag green">odkup</span>':''}${c.soon?'<span class="tag orange">brzy</span>':''}</div><div class="client-bottom"><div><div class="money">${money(c.current)}</div><div class="muted">Vloženo: ${money(c.invested)}</div></div><div style="text-align:right"><div class="money ${c.profitPct>=0?'pos':'neg'}">${percent(c.profitPct)}</div><div class="muted">${funds} fondů</div></div></div></div>`; }).join(''); }
function selectClient(name){ selectedClient=name; closePanels(); renderList(); renderDetail(name); }
function closePanels(){ document.getElementById('importPanel').classList.remove('open'); document.getElementById('formPanel').classList.remove('open'); }
function renderDetail(name){ const c=clients().find(x=>x.name===name); if(!c){ document.getElementById('content').innerHTML='<div class="empty">Klient nenalezen</div>'; return; } const byFund=new Map(); c.rows.forEach((r,i)=>{ const f=r['Fond']||'Bez názvu fondu'; if(!byFund.has(f)) byFund.set(f,[]); byFund.get(f).push({r,index:c.indexes[i]}); }); const eligRows=c.rows.filter(r=>daysToRedeem(r['Datum emise'])!==null&&daysToRedeem(r['Datum emise'])<=0&&num(r['Aktuální hodnota investice'])>0&&r['Typ transakce']!=='Odkup'); const eligTotal=eligRows.reduce((s,r)=>s+num(r['Aktuální hodnota investice']),0); const eligHtml=eligRows.length?`<div class="notice"><div class="notice-title">Způsobilé k odkupu po 36 měsících</div>${eligRows.map(r=>`<div class="eligible-row"><div><b>${html(r['Fond'])}</b><div class="muted">Emise: ${dateOut(r['Datum emise'])} · odkup od: ${dateOut(redeemDate(r['Datum emise']))}</div></div><b class="pos">${money(num(r['Aktuální hodnota investice']))}</b></div>`).join('')}<div class="eligible-row"><b>Celkem způsobilé</b><b class="pos">${money(eligTotal)}</b></div></div>`:''; const fundsHtml=[...byFund.entries()].map(([fond,items])=>fundCard(fond,items)).join(''); document.getElementById('content').className=''; document.getElementById('content').innerHTML=`<div class="detail-head"><div><h1>${html(name)} ${c.eligible?'<span class="tag green">odkup možný</span>':''}</h1><div class="muted">${c.rows.length} transakcí · ${byFund.size} fondů</div></div><div class="actions"><button class="btn" onclick="exportClient(${JSON.stringify(name)})">⬇ JSON</button><button class="btn primary" onclick="openForm(${JSON.stringify(name)})">+ Přidat fond</button><button class="btn red" onclick="deleteClient(${JSON.stringify(name)})">🗑 Smazat klienta</button></div></div><div class="cards"><div class="card"><span>Investováno</span><b>${money(c.invested)}</b></div><div class="card"><span>Aktuální hodnota</span><b class="${c.current>=c.invested?'pos':'neg'}">${money(c.current)}</b></div><div class="card"><span>Čistý výnos</span><b class="${c.profit>=0?'pos':'neg'}">${money(c.profit)}</b><div class="muted">${percent(c.profitPct)}</div></div><div class="card"><span>Fondů</span><b>${byFund.size}</b></div></div>${eligHtml}<h3 style="margin:18px 0 10px">📂 Investiční fondy</h3>${fundsHtml}`; }
function fundCard(fond,items){ const current=items.reduce((s,x)=>s+num(x.r['Aktuální hodnota investice']),0); const invested=items.reduce((s,x)=>s+Math.max(0,num(x.r['Čistá investice'])),0); const profit=current-invested; const pp=invested?profit/invested*100:0; const sold=items.some(x=>x.r['Typ transakce']==='Odkup'); const base=items.find(x=>x.r['Datum emise']&&x.r['Typ transakce']!=='Odkup')||items.find(x=>x.r['Datum emise'])||items[0]; const d=daysToRedeem(base?.r?.['Datum emise']); const eligible=d!==null&&d<=0&&!sold; const badge=sold?'<span class="tag gray">odprodán</span>':eligible?'<span class="tag green">způsobilý</span>':(d!==null&&d<=180?`<span class="tag orange">${d} dní</span>`:(d!==null?`<span class="tag gray">${Math.ceil(d/30.5)} měs.</span>`:'')); return `<div class="fund ${eligible?'eligible':''}"><div class="fund-head" onclick="this.parentElement.classList.toggle('open')"><div><div class="fund-name">${html(fond)}</div><div style="margin-top:5px">${badge}</div></div><div class="fstat"><span>Vloženo</span><b>${money(invested)}</b></div><div class="fstat"><span>Aktuální</span><b class="${current>=invested?'pos':'neg'}">${money(current)}</b></div><div class="fstat"><span>Výnos</span><b class="${pp>=0?'pos':'neg'}">${percent(pp)}</b></div><div class="chev">▼</div></div><div class="fund-body"><div class="tx-actions" style="justify-content:flex-end;margin:0 0 10px"><button class="btn small red" onclick="event.stopPropagation(); deleteFund(${JSON.stringify(fond)})">🗑 Smazat celý fond</button></div>${items.map(x=>txRow(x.r,x.index)).join('')}</div></div>`; }
function txRow(r,index){ const current=num(r['Aktuální hodnota investice']); const inv=num(r['Čistá investice']); const gain=current-inv; const d=daysToRedeem(r['Datum emise']); const rd=redeemDate(r['Datum emise']); const issue=parseDate(r['Datum emise']); const p=issue&&rd?Math.max(0,Math.min(100,(new Date()-issue)/(rd-issue)*100)):0; const eligible=d!==null&&d<=0&&r['Typ transakce']!=='Odkup'; return `<div class="tx"><div class="tx-top"><div><span class="tag blue">${html(r['Typ transakce']||'Platba')}</span> <span class="muted">${html(r['rp.ISIN']||'')}</span></div><b class="${current>=0?'pos':'neg'}">${money(current)}</b></div><div class="tx-grid"><div class="mini"><span>Investováno</span><b>${money(inv)}</b></div><div class="mini"><span>Výnos</span><b class="${gain>=0?'pos':'neg'}">${money(gain)}</b></div><div class="mini"><span>Datum připsání</span><b>${dateOut(r['Datum připsání platby'])}</b></div><div class="mini"><span>Datum emise</span><b>${dateOut(r['Datum emise'])}</b></div><div class="mini"><span>Hodnota CP</span><b>${r['Poslední schválená hodnota CP']!=null?num(r['Poslední schválená hodnota CP']).toFixed(4):'—'}</b></div><div class="mini"><span>Platná do</span><b>${dateOut(r['Poslední schválená hodnota do'])}</b></div><div class="mini"><span>Počet CP</span><b>${r['Počet vydaných CP']!=null?Number(r['Počet vydaných CP']).toLocaleString('cs-CZ'):'—'}</b></div><div class="mini"><span>Typ CP</span><b>${html(r['Typ CP']||'—')}</b></div></div>${r['Datum emise']?`<div class="progress"><span>Emise</span><div class="bar"><div class="${eligible?'done':''}" style="width:${p}%"></div></div><span>${eligible?'✓ způsobilý':(d!==null?Math.ceil(d/30.5)+' měs.':'—')}</span></div>`:''}<div class="tx-actions"><button class="btn small" onclick="event.stopPropagation(); editRecord(${index})">✏️ Upravit</button><button class="btn small red" onclick="event.stopPropagation(); deleteRecord(${index})">🗑 Smazat</button>${eligible?`<button class="btn small green" onclick="event.stopPropagation(); sellRecord(${index})">💸 Odprodej</button>`:''}</div></div>`; }
function togglePanel(id){ const p=document.getElementById(id); const open=p.classList.contains('open'); closePanels(); if(!open) p.classList.add('open'); }
function openForm(prefill=''){ closePanels(); document.getElementById('formPanel').classList.add('open'); document.getElementById('formTitle').textContent=prefill?'Přidat fond — '+prefill:'Nový záznam'; ['fInvestor','fFond','fInvest','fCurrent','fPayDate','fIssueDate','fNav','fNavTo','fIsin','fSecurityType','editIndex'].forEach(id=>document.getElementById(id).value=''); document.getElementById('fTyp').value='Platba'; if(prefill) document.getElementById('fInvestor').value=prefill; window.scrollTo({top:0,behavior:'smooth'}); }
function closeForm(){ document.getElementById('formPanel').classList.remove('open'); document.getElementById('editIndex').value=''; }
function editRecord(index){ const r=records[index]; if(!r) return; openForm(); document.getElementById('formTitle').textContent='Upravit záznam'; document.getElementById('editIndex').value=index; document.getElementById('fInvestor').value=r['Investor']||''; document.getElementById('fFond').value=r['Fond']||''; document.getElementById('fTyp').value=r['Typ transakce']||'Platba'; document.getElementById('fInvest').value=num(r['Čistá investice']); document.getElementById('fCurrent').value=num(r['Aktuální hodnota investice']); document.getElementById('fPayDate').value=isoDate(r['Datum připsání platby'])||''; document.getElementById('fIssueDate').value=isoDate(r['Datum emise'])||''; document.getElementById('fNav').value=r['Poslední schválená hodnota CP']||''; document.getElementById('fNavTo').value=isoDate(r['Poslední schválená hodnota do'])||''; document.getElementById('fIsin').value=r['rp.ISIN']||''; document.getElementById('fSecurityType').value=r['Typ CP']||''; }
function formRecord(){ const investor=document.getElementById('fInvestor').value.trim(); const fond=document.getElementById('fFond').value.trim(); const invested=num(document.getElementById('fInvest').value); if(!investor||!fond) throw new Error('Vyplň investora a fond.'); return {'Investor':investor,'Poradce':'Solár Filip','Fond':fond,'Typ transakce':document.getElementById('fTyp').value,'Čistá investice':invested,'Aktuální hodnota investice':document.getElementById('fCurrent').value===''?invested:num(document.getElementById('fCurrent').value),'Datum připsání platby':document.getElementById('fPayDate').value||null,'Datum emise':document.getElementById('fIssueDate').value||null,'Poslední schválená hodnota CP':document.getElementById('fNav').value===''?null:num(document.getElementById('fNav').value),'Poslední schválená hodnota do':document.getElementById('fNavTo').value||null,'rp.ISIN':document.getElementById('fIsin').value||null,'Typ CP':document.getElementById('fSecurityType').value||null,'Měna':'CZK'}; }
function saveRecord(){ try{ const rec=formRecord(); const idx=document.getElementById('editIndex').value; if(idx==='') records.push(rec); else records[Number(idx)]={...records[Number(idx)],...rec}; selectedClient=rec['Investor']; save(); closeForm(); renderAll(); toast('Záznam uložen ✓'); } catch(e){ toast(e.message); } }
function refreshAfterDelete(){ save(); const exists=selectedClient&&clients().some(c=>c.name===selectedClient); if(!exists) selectedClient=null; renderAll(); }
function deleteRecord(index){ if(!confirm('Opravdu smazat tento záznam?')) return; records.splice(index,1); refreshAfterDelete(); toast('Záznam smazán'); }
function deleteFund(fond){ if(!selectedClient) return; const count=records.filter(r=>r['Investor']===selectedClient&&r['Fond']===fond).length; if(!count) return; if(!confirm(`Opravdu smazat celý fond „${fond}“ u klienta ${selectedClient}?\nSmaže se ${count} záznamů.`)) return; records=records.filter(r=>!(r['Investor']===selectedClient&&r['Fond']===fond)); refreshAfterDelete(); toast('Fond smazán'); }
function deleteClient(name){ const count=records.filter(r=>r['Investor']===name).length; if(!count) return; if(!confirm(`Opravdu smazat celého klienta „${name}“?\nSmaže se ${count} záznamů/fondů.`)) return; records=records.filter(r=>r['Investor']!==name); selectedClient=null; refreshAfterDelete(); toast('Klient smazán'); }
function sellRecord(index){ const r=records[index]; if(!r) return; const date=prompt('Datum odprodeje (YYYY-MM-DD):',new Date().toISOString().slice(0,10)); if(!date) return; const value=prompt('Částka odprodeje v CZK (prázdné = aktuální hodnota):',''); records.push({...r,'Typ transakce':'Odkup','Čistá investice':0,'Aktuální hodnota investice':value===''?-Math.abs(num(r['Aktuální hodnota investice'])):num(value),'Datum připsání platby':date,'Datum emise':null}); save(); renderAll(); toast('Odprodej zaznamenán ✓'); }
function exportClient(name){ const c=clients().find(x=>x.name===name); if(!c) return; const blob=new Blob([JSON.stringify(c,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name.replace(/\s+/g,'_')+'.json'; a.click(); URL.revokeObjectURL(a.href); }
function splitCSVLine(line,sep){ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"'; i++;} else q=!q; } else if(ch===sep&&!q){ out.push(cur.trim()); cur=''; } else cur+=ch; } out.push(cur.trim()); return out.map(x=>x.replace(/^"|"$/g,'')); }
function parseCSVText(text){ text=text.replace(/^\uFEFF/,''); const lines=text.split(/\r?\n/).filter(l=>l.trim()); if(lines.length<2) throw new Error('CSV je prázdné.'); const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':','; const headers=splitCSVLine(lines[0],sep).map(h=>h.replace(/^\uFEFF/,'').trim()); const rows=[]; for(const line of lines.slice(1)){ const vals=splitCSVLine(line,sep); const o={}; headers.forEach((h,i)=>o[h]=vals[i]??''); if(o['Investor']&&o['Fond']) rows.push(o); } return rows; }
function handleFile(file){ if(!file) return; const reader=new FileReader(); reader.onload=e=>{ try{ importRows(parseCSVText(e.target.result)); } catch(err){ toast(err.message); } }; reader.readAsText(file,'UTF-8'); }
function importRows(rows){ let added=0,updated=0; rows.forEach(row=>{ const rec={'Investor':String(row['Investor']||'').trim(),'Fond':String(row['Fond']||'').trim(),'Typ CP':row['Typ CP']||null,'rp.ISIN':row['rp.ISIN']||row['ISIN']||null,'Typ transakce':row['Typ transakce']||'Platba','Čistá investice':num(row['Čistá investice']),'Aktuální hodnota investice':num(row['Aktuální hodnota investice']),'Datum připsání platby':isoDate(row['Datum připsání platby']),'Datum emise':isoDate(row['Datum emise']),'Poslední schválená hodnota CP':row['Poslední schválená hodnota CP']?num(row['Poslední schválená hodnota CP']):null,'Poslední schválená hodnota do':isoDate(row['Poslední schválená hodnota do']),'Počet vydaných CP':num(row['Počet vydaných CP']),'Upisovací hodnota':num(row['Upisovací hodnota']),'Poradce':row['Poradce']||'Solár Filip','Měna':row['Měna']||'CZK'}; const keyDate=rec['Datum emise']; const i=records.findIndex(r=>r['Investor']===rec['Investor']&&r['Fond']===rec['Fond']&&isoDate(r['Datum emise'])===keyDate); if(i>=0){ records[i]={...records[i],...rec}; updated++; } else { records.push(rec); added++; } }); save(); closePanels(); renderAll(); toast(`Import hotov: +${added}, aktualizováno ${updated}`); }
function downloadTemplate(){ const csv='Investor;Fond;Typ CP;rp.ISIN;Typ transakce;Čistá investice;Aktuální hodnota investice;Datum připsání platby;Datum emise;Poslední schválená hodnota CP;Poslední schválená hodnota do;Počet vydaných CP;Upisovací hodnota;Měna\nNovák Jan;r2p invest SICAV, a.s.;Prioritní investiční akcie;CZ0008043445;Platba;200000;228000;2023-05-10;2023-07-01;1.74;2026-02-28;133770;1.4951;CZK'; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})); a.download='vzor_import_investice.csv'; a.click(); URL.revokeObjectURL(a.href); }
const drop=document.getElementById('drop'); drop.onclick=()=>document.getElementById('fileInput').click(); drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')}; drop.ondragleave=()=>drop.classList.remove('drag'); drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');handleFile(e.dataTransfer.files[0]);};
window.addEventListener('DOMContentLoaded',()=>{ load(); renderAll(); });
</script>
