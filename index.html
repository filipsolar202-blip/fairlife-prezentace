<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FairLife | Interaktivní mapa spolupráce</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --navy: #154e72;
      --cyan: #2fb8cc;
      --blue: #0b7ee8;
      --green: #15905f;
      --violet: #7556d7;
      --orange: #e86b00;
      --line: rgba(0,0,0,.08);
      --shadow: 0 22px 70px rgba(0,0,0,.10);
      --soft-shadow: 0 10px 32px rgba(0,0,0,.07);
      --radius: 34px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(47,184,204,.15), transparent 32%),
        radial-gradient(circle at 88% 8%, rgba(21,78,114,.13), transparent 30%),
        var(--bg);
    }

    button, input { font-family: inherit; }

    .page {
      width: min(1460px, calc(100vw - 44px));
      margin: 0 auto;
      padding: 26px 0 38px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .logo {
      height: 72px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .advisor {
      text-align: right;
      font-size: 18px;
      font-weight: 850;
      color: var(--navy);
      line-height: 1.15;
    }

    .advisor span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      margin-top: 5px;
    }

    .hero {
      text-align: center;
      margin: 18px auto 30px;
      max-width: 980px;
    }

    .eyebrow {
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 5.5vw, 82px);
      line-height: .95;
      letter-spacing: -.068em;
      font-weight: 850;
    }

    .hero p {
      margin: 18px auto 0;
      max-width: 820px;
      color: #45454a;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 600;
    }

    .map-shell {
      position: relative;
      min-height: 650px;
      border-radius: 44px;
      background: rgba(255,255,255,.58);
      border: 1px solid rgba(255,255,255,.82);
      box-shadow: var(--shadow);
      overflow: hidden;
      padding: 36px;
      backdrop-filter: blur(18px);
    }

    .map-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(21,78,114,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(21,78,114,.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, black, transparent 76%);
      opacity: .8;
    }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 238px;
      height: 238px;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #eef8fc);
      border: 1px solid rgba(255,255,255,.94);
      box-shadow: 0 24px 70px rgba(21,78,114,.14), inset 0 1px 0 rgba(255,255,255,.9);
      display: grid;
      place-items: center;
      text-align: center;
      z-index: 4;
      padding: 30px;
    }

    .center svg {
      width: 42px;
      height: 42px;
      stroke: var(--navy);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 10px;
    }

    .center strong {
      display: block;
      color: var(--navy);
      font-size: 23px;
      line-height: 1.08;
      letter-spacing: -.03em;
    }

    .center span {
      display: block;
      color: var(--muted);
      font-weight: 750;
      margin-top: 10px;
      font-size: 13px;
    }

    .path {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .path path {
      fill: none;
      stroke: rgba(21,78,114,.20);
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .node {
      position: absolute;
      z-index: 3;
      width: 334px;
      min-height: 166px;
      border-radius: 30px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.86);
      box-shadow: var(--soft-shadow);
      padding: 18px;
      cursor: pointer;
      transition: .22s ease;
      text-align: left;
    }

    .node:hover {
      transform: translateY(-5px);
      box-shadow: 0 24px 58px rgba(0,0,0,.12);
    }

    .node.dim {
      opacity: .34;
      filter: grayscale(1);
      transform: scale(.98);
    }

    .node.active {
      opacity: 1;
      filter: none;
      outline: 4px solid rgba(47,184,204,.25);
      transform: translateY(-5px);
    }

    .node-top {
      display: flex;
      gap: 13px;
      align-items: center;
      margin-bottom: 13px;
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #fff, #eef8fc);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 26px rgba(21,78,114,.12);
      flex: 0 0 auto;
    }

    .icon svg {
      width: 32px;
      height: 32px;
      stroke: var(--navy);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.06;
      letter-spacing: -.04em;
    }

    .node p {
      margin: 0;
      color: #515158;
      line-height: 1.42;
      font-weight: 650;
      font-size: 15px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .chip {
      font-size: 11px;
      font-weight: 850;
      padding: 7px 9px;
      border-radius: 999px;
      color: #45454a;
      background: #f5f5f7;
      border: 1px solid var(--line);
    }

    .node-bydleni { left: 7%; top: 16%; }
    .node-majetek { right: 7%; top: 16%; }
    .node-ochrana { left: 7%; bottom: 13%; }
    .node-plan { right: 7%; bottom: 13%; }

    .node-majetek .icon svg { stroke: var(--green); }
    .node-ochrana .icon svg { stroke: var(--violet); }
    .node-plan .icon svg { stroke: var(--orange); }

    .detail-panel {
      display: none;
      position: relative;
      z-index: 5;
      margin-top: 28px;
      background: #fff;
      border-radius: 38px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.8);
      padding: 28px;
      animation: show .25s ease both;
    }

    .detail-panel.active { display: block; }

    @keyframes show {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      gap: 22px;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .detail-title h2 {
      margin: 0;
      font-size: clamp(34px, 4vw, 56px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .detail-title p {
      margin: 12px 0 0;
      color: #515158;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.45;
      max-width: 760px;
    }

    .close {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      background: #f5f5f7;
      color: var(--ink);
      font-weight: 850;
      cursor: pointer;
      white-space: nowrap;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .box {
      border-radius: 26px;
      background: #f7f8fa;
      border: 1px solid var(--line);
      padding: 22px;
      min-height: 190px;
    }

    .box h3 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 21px;
      letter-spacing: -.025em;
    }

    .box p, .box li {
      color: #4b4b50;
      font-weight: 650;
      line-height: 1.52;
    }

    .box p { margin: 0; }
    .box ul { margin: 0; padding-left: 18px; }

    .examples {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .example {
      border-radius: 26px;
      background: linear-gradient(150deg, #f3fbff, #fff 70%);
      border: 1px solid rgba(21,78,114,.11);
      padding: 22px;
      min-height: 156px;
    }

    .example h4 {
      margin: 0 0 9px;
      color: var(--navy);
      font-size: 19px;
      letter-spacing: -.02em;
    }

    .example p {
      margin: 0;
      color: #55565c;
      font-weight: 650;
      line-height: 1.45;
    }

    .table-wrap {
      margin-top: 16px;
      border-radius: 24px;
      overflow: auto;
      border: 1px solid var(--line);
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 14px 15px;
      border-bottom: 1px solid rgba(0,0,0,.07);
      text-align: right;
      font-weight: 650;
    }

    th:first-child, td:first-child { text-align: left; }
    th {
      background: #f5f7fa;
      color: #3b3b40;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    tr:last-child td { border-bottom: 0; }
    .plus { color: var(--green); font-weight: 900; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.45; font-weight: 650; margin-top: 10px; }

    .priority {
      margin-top: 18px;
      border-radius: 30px;
      background: #f7f8fa;
      border: 1px solid var(--line);
      padding: 22px;
    }

    .priority h3 {
      margin: 0 0 12px;
      font-size: 24px;
      letter-spacing: -.03em;
    }

    .checks {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 9px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 13px;
      font-weight: 750;
      color: #3f3f44;
    }

    input { accent-color: var(--blue); }

    @media (max-width: 1180px) {
      .map-shell { min-height: auto; padding: 24px; }
      .center, .path { display: none; }
      .node {
        position: relative;
        left: auto !important;
        right: auto !important;
        top: auto !important;
        bottom: auto !important;
        width: 100%;
      }
      .mobile-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .detail-grid, .examples, .checks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 1181px) {
      .mobile-grid { display: contents; }
    }

    @media (max-width: 720px) {
      .page { width: min(100vw - 28px, 1460px); padding-top: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .advisor { text-align: left; }
      .logo { height: 58px; }
      .hero { margin-bottom: 22px; }
      h1 { font-size: 42px; }
      .hero p { font-size: 17px; }
      .mobile-grid, .detail-grid, .examples, .checks { grid-template-columns: 1fr; }
      .detail-head { flex-direction: column; }
      .close { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <img class="logo" src="./fairlife-logo.jpeg" alt="FairLife logo" />
      <div class="advisor">Filip Solár<span>osobní finanční poradce</span></div>
    </header>

    <section class="hero">
      <div class="eyebrow">Interaktivní mapa spolupráce</div>
      <h1>Co spolu můžeme řešit?</
